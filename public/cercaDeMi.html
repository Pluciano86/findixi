<!doctype html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="https://zgjaxanqfkweslkxtayt.supabase.co/storage/v1/object/public/findixi/loader.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerca de mí</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <script type="module" src="./js/i18n.js"></script>
</head>

<body class="bg-[#121212]" style="font-family: 'Kanit', sans-serif;">

<div class="min-h-screen flex justify-center bg-[#121212]">
  <div class="w-full max-w-md bg-white text-gray-800 h-screen flex flex-col">

  <div id="headerContainer" class="h-16 shrink-0 z-40"></div>

<section
  class="px-3 py-2 bg-white text-center border-b shadow shrink-0"
  style="position: sticky; top: 0; z-index: 1000;"
>

  <h2 class="text-lg font-medium mb-2" >Explora cerca de ti</h2>

  <div id="geoFallbackPanel" class="hidden rounded-2xl border border-amber-200 bg-amber-50 px-3 py-3 text-left">
    <p class="text-sm font-semibold text-amber-900" data-i18n="cerca.geoFallbackTitle">
      No pudimos usar tu ubicación exacta.
    </p>
    <p class="mt-1 text-xs text-amber-900/90" data-i18n="cerca.geoFallbackBody">
      Selecciona un municipio para continuar o vuelve a intentar la geolocalización.
    </p>

    <div class="mt-3">
      <label for="fallbackMunicipioSelect" class="mb-1 block text-xs font-medium text-amber-900" data-i18n="cerca.geoFallbackMunicipioLabel">
        Municipio
      </label>
      <select
        id="fallbackMunicipioSelect"
        class="w-full rounded-xl border border-amber-200 bg-white px-3 py-2 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-amber-300"
      >
        <option value="" data-i18n="cerca.geoFallbackMunicipioPlaceholder">Selecciona un municipio...</option>
      </select>
    </div>

    <p id="geoFallbackStatus" class="mt-2 hidden text-xs text-amber-900"></p>

    <div class="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-2">
      <button
        id="btnFallbackApplyMunicipio"
        type="button"
        class="rounded-xl bg-[#3ea6c4] px-3 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-[#358faa]"
        data-i18n="cerca.geoFallbackApplyMunicipio"
      >
        Ver comercios en este municipio
      </button>
      <button
        id="btnFallbackRetryGeo"
        type="button"
        class="rounded-xl border border-amber-300 bg-white px-3 py-2 text-sm font-medium text-amber-900 shadow-sm transition hover:bg-amber-100"
        data-i18n="cerca.geoFallbackRetry"
      >
        Usar mi ubicación otra vez
      </button>
    </div>
  </div>

<div class="place-types" aria-label="Tipos de lugares">
<button type="button" data-place-type="all" aria-pressed="true">Todos</button>
<button type="button" data-place-type="commerce" aria-pressed="false">Comercios</button>
<button type="button" data-place-type="beach" aria-pressed="false">Playas</button>
</div>
<div class="nearby-search-row">
  <label class="flex items-center gap-2 border border-gray-200 rounded-xl shadow-sm px-3 py-2 bg-white focus-within:ring-2 focus-within:ring-blue-500 w-full">
    <i class="fas fa-search text-gray-400"></i>
    <input
      id="searchNombre"
      type="text"
      placeholder="Buscar comercios o descripciones"

      class="flex-1 text-sm outline-none bg-transparent"
    />
  </label>
  <button
    id="btnToggleFiltros"
    type="button"
    class="flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 
           text-gray-800 text-sm font-medium px-4 py-2 rounded-xl border 
           border-gray-200 shadow-sm transition whitespace-nowrap"
  >
    <i class="fas fa-sliders-h"></i>
    <span data-i18n="cerca.filtros">Filtros</span>
  </button>
</div>



  <div id="panelFiltros" class="mt-4 space-y-4 hidden">
    <label for="filtroCategoria" class="block text-left text-sm font-medium">Categoría</label>
<select
    id="filtroCategoria"
    class="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white shadow-sm
           focus:ring-2 focus:ring-[#3ea6c4] focus:outline-none"
  >
    <option value="" data-i18n="cerca.categoriasTodas">Todas las categorías</option>
  </select>
    <div class="flex flex-wrap items-center justify-center gap-6 text-sm">
      <label class="flex items-center gap-2 cursor-pointer select-none">
        <span class="relative inline-flex items-center">
          <input id="filtroAbierto" type="checkbox" class="sr-only peer" />
          <span class="w-11 h-6 bg-gray-300 rounded-full transition-colors peer-checked:bg-green-500"></span>
          <span class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full shadow transition-transform peer-checked:translate-x-5"></span>
        </span>
        <span class="font-medium text-gray-800" data-i18n="cerca.abierto">Abierto ahora</span>
      </label>

      <label class="flex items-center gap-2 cursor-pointer select-none">
        <span class="relative inline-flex items-center">
          <input id="filtroFavoritos" type="checkbox" class="sr-only peer" />
          <span class="w-11 h-6 bg-gray-300 rounded-full transition-colors peer-checked:bg-purple-600"></span>
          <span class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full shadow transition-transform peer-checked:translate-x-5"></span>
        </span>
        <span class="font-medium text-gray-800" data-i18n="cerca.favoritos">Mis Favoritos</span>
      </label>
    </div>

    <div class="flex flex-col items-center justify-center space-y-2">
      <p class="text-xs text-gray-500 text-center" data-i18n="cerca.ajusteRadio">
        Ajusta el radio para ampliar o reducir el perímetro de búsqueda.
      </p>
      <div class="flex items-center justify-center gap-3">
        <label for="radioKm" class="text-sm font-medium" data-i18n="cerca.radio">Radio (mi):</label>
        <input
          id="radioKm"
          type="range"
          min="1"
          max="100"
          step="1"
          value="5"
          class="w-60 accent-[#3ea6c4]"
        />
        <span id="radioKmLabel" class="text-sm">5 mi</span>
      </div>
    </div>
  </div>
  <button id="togglePlaceList" type="button" class="list-toggle">Ver lista</button>
  <div class="nearby-toolbar">
    <div id="mapStatus" role="status" aria-live="polite">Buscando tu ubicación…</div>

  </div>
</section>

  <main class="flex-1 relative min-h-[240px]">
    <button id="centrarMapa" type="button" aria-label="Centrar mapa en mi ubicación" title="Centrar mapa en mi ubicación"><i class="fas fa-location-arrow" aria-hidden="true"></i></button>
    <div id="map" class="absolute inset-0 w-full h-full pb-1 z-0"></div>
    <div id="nearbyList" hidden aria-label="Lugares en esta zona"></div>
    <section id="selectedCommerce" hidden aria-label="Comercio seleccionado" class="commerce-sheet">
      <button id="closeCommerce" type="button" aria-label="Cerrar comercio" class="sheet-close">×</button>
      <div id="selectedCommerceContent"></div>
    </section>
  </main>

  <div id="loader" class="fixed inset-0 hidden items-center justify-center z-40">
    <img
      src="https://zgjaxanqfkweslkxtayt.supabase.co/storage/v1/object/public/findixi/loader.png"
      alt="Cargando"
      class="w-16 h-16 animate-spin"
    />
  </div>

  <div id="footerContainer" class="h-16 shrink-0"></div>

  <script src="https://kit.fontawesome.com/a2e0e6ad5b.js" crossorigin="anonymous"></script>
  <script type="module" src="./js/header.js"></script>
  <script type="module" src="./js/footer.js"></script>
  <script type="module" src="./js/cercaDeMi.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.initI18n) window.initI18n();
    });
  </script>

  <style>
  .commerce-sheet { position: absolute; bottom: 8px; left: 8px; right: 8px; z-index: 600; background: white; border-radius: 20px; box-shadow: 0 6px 30px #0003; max-height: 65%; overflow-y: auto; padding: 16px; }
  .commerce-sheet[hidden] { display: none; }
  .sheet-close { position: absolute; right: 8px; top: 4px; width: 44px; height: 44px; font-size: 28px; }
  .merchant-horizontal { display:grid; grid-template-columns:minmax(0, 28fr) minmax(0, 20fr) minmax(0, 52fr); gap:10px; align-items:center; }
  .merchant-horizontal .nearby-cover { grid-column:1; grid-row:1; width:100%; height:112px; margin:0; border-radius:10px; }
  .merchant-horizontal .nearby-summary { display:contents; }
  .merchant-horizontal .nearby-summary > img { grid-column:2; grid-row:1; width:100%; height:70px; object-fit:contain; }
  .merchant-horizontal .nearby-summary > div { grid-column:3; grid-row:1; min-width:0; padding-left:8px; border-left:1px solid #e2e8f0; font-size:13px; overflow-wrap:anywhere; }
  .merchant-horizontal .nearby-summary h3 { font-size:16px; line-height:1.2; padding-right:16px; }
  .merchant-horizontal .nearby-actions { grid-column:1 / -1; margin-top:2px; }
  .merchant-horizontal .nearby-phone { padding:5px 7px; font-size:12px; }
  .merchant-horizontal .nearby-travel { font-size:11px; }
  .merchant-horizontal .nearby-open, .merchant-horizontal .nearby-closed { font-size:12px; }
  .beach-horizontal .nearby-summary { display:grid; grid-template-columns:38% minmax(0, 1fr); gap:14px; padding-right:12px; }
  .beach-horizontal .nearby-summary > img { width:100%; height:112px; object-fit:cover; border-radius:12px; }
  .beach-horizontal h3 { font-size:17px; line-height:1.25; padding-right:14px; }
  .beach-horizontal .nearby-closed { color:#168f9c; margin-top:6px; font-size:14px; }
  .beach-horizontal .nearby-actions { grid-template-columns:1fr; }
  .list-toggle { border:1px solid #cbd5e1; border-radius:16px; padding:5px 12px; color:#023047; font-size:13px; margin-top:6px; }
  #nearbyList { position:absolute; inset:0; z-index:550; overflow:auto; background:#f8fafc; padding:12px; }
  #nearbyList[hidden] { display:none; }
  .place-list-card { display:flex; align-items:center; gap:12px; width:100%; padding:10px; margin-bottom:10px; background:white; border-radius:14px; text-align:left; color:#023047; }
  .place-list-card img { width:80px; height:64px; object-fit:cover; border-radius:10px; }
  .place-selected { filter:drop-shadow(0 0 5px #f58220) drop-shadow(0 0 3px #f58220); }
  .nearby-summary .map-weather-icon { width:32px; height:32px; object-fit:contain; }
  .nearby-cover { width:100%; height:120px; object-fit:cover; border-radius:12px; margin-bottom:12px; }
  .nearby-open { color:#378548; font-size:14px; }
  .nearby-closed { color:#6b7280; font-size:14px; }
  .nearby-phone { display:inline-block; background:#ef4444; color:white; border-radius:20px; padding:5px 12px; margin-top:6px; font-size:14px; }
  .nearby-travel { color:#64748b; font-size:13px; margin-top:6px; }
  .nearby-summary { display: flex; gap: 12px; padding-right: 32px; align-items: center; }
  .nearby-summary img { width: 64px; height: 64px; object-fit: contain; border-radius: 12px; }
  .nearby-actions { display: flex; gap: 8px; margin-top: 12px; }
  .nearby-actions a, .nearby-actions button { flex: 1; text-align: center; padding: 12px 8px; border-radius: 12px; background: #edf9fd; color: #07536a; font-weight: 600; }
  .nearby-actions a { background: #07536a; color: white; }
  .nearby-cluster { display: grid; place-items: center; background: #fff; color: #023047; border: 3px solid #f58220; border-radius: 15px; font: 600 17px/1 'Kanit', sans-serif; box-shadow: 0 3px 8px #02304726; }
  .nearby-cluster:focus-visible { outline: 3px solid #023047; outline-offset: 3px; }
  .nearby-search-row { display: flex; align-items: center; gap: 8px; }
  .nearby-search-row > label { flex: 1; min-width: 0; min-height: 44px; }
  #searchNombre { min-width: 0; width: 100%; }
  #btnToggleFiltros { min-height: 44px; padding: 8px 12px; }
  #filtroCategoria { width: 100%; min-height: 44px; }
  .place-types { display:flex; gap:6px; margin-bottom:8px; }
  .place-types button { flex:1; min-height:36px; border-radius:18px; border:1px solid #cbd5e1; background:white; color:#023047; font-size:14px; }
  .place-types button[aria-pressed="true"] { background:#023047; color:white; border-color:#023047; }
  .beach-marker { display:flex; align-items:center; justify-content:center; background:#18b7bd; border:3px solid white; border-radius:50%; font-size:24px; box-shadow:0 2px 8px #02304755; }
  .nearby-toolbar { margin-top: 6px; min-height: 24px; display: flex; align-items: center; gap: 8px; text-align: center; }
  #mapStatus { flex: 1; min-width: 0; color: #52616b; font-size: 13px; line-height: 1.35; }
  #centrarMapa { position: absolute; right: 14px; bottom: 38px; z-index: 500; display: grid; place-items: center; width: 48px; height: 48px; background: #023047; color: white; border: 2px solid white; border-radius: 50%; font-size: 19px; box-shadow: 0 3px 12px #02304740; }
  #centrarMapa:focus-visible, .nearby-search-area:focus-visible { outline: 3px solid #f58220; outline-offset: 2px; }
  .nearby-search-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 500; width: max-content; max-width: calc(100% - 112px); padding: 8px 14px; min-height: 44px; box-shadow: 0 3px 12px #02304726; border: 1px solid #f58220; background: #fff4e9; color: #023047; border-radius: 12px; font-size: 14px; }
  #footerContainer { height: auto; }
  #footerContainer [data-footer-fixed] { position: relative !important; left: auto !important; bottom: auto !important; transform: none !important; }

  #panelFiltros:not(.hidden) { position: absolute; left: 8px; right: 8px; top: 100%; margin-top: 8px; padding: 16px; background: white; border-radius: 18px; box-shadow: 0 8px 28px #0003; max-height: 45dvh; overflow-y: auto; }
  #radioKm { max-width: 48vw; }
  #map { min-height: 240px; }
  body > .min-h-screen > div { height: 100dvh; }
  .leaflet-popup-content { max-width: calc(100vw - 64px); }
  /* === Logo en el pin === */
  .marker-wrapper {
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.25);
    background: white;
  }

  .marker-logo img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid white;
  }

  /* === Popup limpio sin márgenes extras === */
  .leaflet-popup-content {
    margin: 0 !important;
    width: auto !important;
  }

  .leaflet-popup-content-wrapper {
    border-radius: 20px !important;
    padding: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
  }

  .leaflet-popup-tip-container {
    display: none !important; /* ocultar la flechita del popup */
  }

  /* === Tarjeta interna === */
  .popup-comercio {
    width: 280px; /* igual al ancho del card original */
    border-radius: 20px;
    overflow: hidden;
    background: white;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  }

  .popup-comercio .card-comercio {
    max-width: 100% !important;
    margin: 0 !important;
    border-radius: 20px;
  }

 /* 🔧 Corrige el botón de teléfono dentro del popup */
.leaflet-popup-content .card-comercio a[href^="tel:"],
.leaflet-popup-content .card-comercio button[href^="tel:"] {
  color: #ffffff !important;
  background-color: #dc2626 !important; /* rojo igual al del listado */
  border: none !important;
  text-decoration: none !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  font-weight: 600 !important;
  font-size: 16px !important;
  padding: 10px 22px !important;
  border-radius: 9999px !important;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25) !important;
  transition: opacity 0.2s ease !important;
  line-height: 1 !important;
}

/* 🔹 Asegura color blanco en texto e ícono dentro del botón */
.leaflet-popup-content .card-comercio a[href^="tel:"] *,
.leaflet-popup-content .card-comercio a[href^="tel:"] i,
.leaflet-popup-content .card-comercio a[href^="tel:"] span {
  color: #ffffff !important;
  fill: #ffffff !important;
}

/* 🔹 Efecto hover */
.leaflet-popup-content .card-comercio a[href^="tel:"]:hover {
  opacity: 0.9 !important;
}
</style>


</div>
</div>
  <script type="module" src="js/introSplash.js"></script>
</body>
</html>
