<style>
  :root {
    --admin-sidebar-collapsed: 72px;
    --admin-sidebar-expanded: 280px;
  }

  #adminSidebar {
    width: var(--admin-sidebar-collapsed);
    transform: translateX(0);
    transition: width 220ms ease, transform 220ms ease;
  }

  #adminSidebar nav a[data-sidebar-link].is-active {
    color: #ffb703;
    background: rgba(255, 183, 3, 0.16);
  }

  #adminSidebar nav a[data-sidebar-link].is-active i,
  #adminSidebar nav a[data-sidebar-link].is-active .admin-label {
    color: #ffb703;
  }

  #adminSidebar .admin-label,
  #adminSidebar .admin-header-label {
    opacity: 0;
    width: 0;
    overflow: hidden;
    pointer-events: none;
    transition: opacity 140ms ease;
    white-space: nowrap;
  }

  body.admin-sidebar-open #adminSidebar {
    width: var(--admin-sidebar-expanded);
  }

  body.admin-sidebar-open #adminSidebar .admin-label,
  body.admin-sidebar-open #adminSidebar .admin-header-label {
    opacity: 1;
    width: auto;
    pointer-events: auto;
  }

  @media (min-width: 1024px) {
    #headerContainer ~ *:not(script):not(style) {
      margin-left: var(--admin-sidebar-collapsed);
      transition: margin-left 220ms ease;
    }

    #adminSidebar .admin-user-wrap {
      justify-content: center;
    }

    body.admin-sidebar-open #adminSidebar .admin-user-wrap {
      justify-content: flex-start;
    }
  }

  @media (max-width: 1023px) {
    #adminSidebar {
      width: min(85vw, var(--admin-sidebar-expanded));
      transform: translateX(-100%);
    }

    body.admin-sidebar-open #adminSidebar {
      transform: translateX(0);
    }

    #adminSidebar .admin-label,
    #adminSidebar .admin-header-label {
      opacity: 1;
      width: auto;
      pointer-events: auto;
    }
  }
</style>
